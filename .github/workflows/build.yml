name: Build CleanRamVPS

on:
  push:
    tags:
      - 'v*' # Tự chạy khi đẩy tag mới (vd: v1.0.0)
  workflow_dispatch: {} # Nút bấm chạy thủ công

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write # Cấp quyền tạo Release cho GitHub Actions

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cài Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release

      - name: Create GitHub Release & Upload EXE
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/CleanRamVPS.exe
          tag_name: ${{ github.ref_name }}
          name: CleanRamVPS ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
