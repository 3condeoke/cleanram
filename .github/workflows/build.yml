name: Build CleanRamVPS

# Chạy khi push code lên nhánh main, hoặc bấm nút "Run workflow" thủ công
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cài Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release

      - name: Upload file .exe
        uses: actions/upload-artifact@v4
        with:
          name: CleanRamVPS-windows
          path: target/release/CleanRamVPS.exe
          if-no-files-found: error
